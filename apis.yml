apis:
- aid: reachdesk:reachdesk-mcp
  name: Reachdesk MCP Server
  description: >-
    Reachdesk operates a first-party remote Model Context Protocol server at https://app.reachdesk.com/mcp,
    on the same host as its REST API. It is a hosted HTTP endpoint an MCP client POSTs to directly — there
    is no stdio package to install. Access is OAuth 2.1 with dynamic client registration (RFC 7591), PKCE
    S256, and two published scopes, mcp:tools.user.read and mcp:tools.user.write, which scope tools to
    the authenticated Reachdesk user. The server is undocumented in Reachdesk's knowledge base and API
    reference; it was found by probing the API host, and the tool list is auth-gated.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://reachdesk.readme.io/
  baseURL: https://app.reachdesk.com/mcp
