apis:
  - aid: reachdesk:reachdesk-api
    name: Reachdesk API
    description: >-
      The Reachdesk REST API enables programmatic triggering of gift campaigns
      and sending of physical gifts, branded merchandise, and digital rewards.
      Authenticated via API tokens generated in the Reachdesk platform settings,
      the API integrates with CRM and marketing automation workflows to automate
      gifting as part of sales and customer success programs. The contract is
      published as OpenAPI 3.1 and declares 9 operations across sends, contacts,
      transactions, organization and GDPR data-subject requests, based at
      https://app.reachdesk.com/api/v2.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://support.reachdesk.com/hc/en-gb/categories/4404901379473-Integrations-API
