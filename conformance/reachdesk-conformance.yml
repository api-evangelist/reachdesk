  - id: rfc7636
    name: PKCE
    conforms: true
    evidence: 'code_challenge_methods_supported: ["S256"] — S256 only, plain is not offered.'
  - id: mcp
    name: Model Context Protocol
    conforms: true
    evidence: >-
      POST https://app.reachdesk.com/mcp returns a JSON-RPC 2.0 error envelope and a
      WWW-Authenticate: Bearer realm="MCP" challenge. Tool list is auth-gated so the
      protocol version could not be read.
    caveats:
