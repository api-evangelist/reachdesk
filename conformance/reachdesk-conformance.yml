description: >-
  Standards conformance assessment for Reachdesk. Every entry is judged against a
  document Reachdesk actually serves or an artifact already in this repo. The
  strongest results are on the MCP/OAuth side — Reachdesk implements the full
  modern OAuth discovery stack (RFC 8414 + RFC 9728 + RFC 7591 + PKCE) — while the
  REST API conforms to almost nothing beyond OpenAPI itself.
standards:
  - id: openapi-3.1
    name: OpenAPI Specification 3.1.0
    conforms: true
    evidence: >-
      https://reachdesk.readme.io/openapi/605275c06991600049cc768e serves a valid
      OpenAPI 3.1.0 document declaring 9 operations, all with unique operationIds
      and summaries. Saved verbatim to openapi/_original/.
    caveats:
      - >-
        One path key is malformed: "/sends?start_date={start_date}&end_date={end_date}"
        embeds a query string in the path template, which is not valid OpenAPI path
        syntax. The real path is /sends.
      - components.schemas is empty; no $ref reuse anywhere.
      - No tags are declared and no operation is tagged.
  - id: oauth2
    name: OAuth 2.0 / 2.1 authorization framework
    conforms: true
    surface: mcp
    evidence: >-
      https://app.reachdesk.com/oauth/authorize + /oauth/token with
      authorization_code, client_credentials and refresh_token grants, advertised in
      the provider's own authorization-server metadata.
  - id: rfc8414
    name: OAuth 2.0 Authorization Server Metadata
    conforms: true
    evidence: >-
      GET https://app.reachdesk.com/.well-known/oauth-authorization-server returns
      200 application/json with issuer, authorization_endpoint, token_endpoint,
      registration_endpoint, response_types_supported, grant_types_supported,
      token_endpoint_auth_methods_supported, code_challenge_methods_supported and
      scopes_supported.
  - id: rfc9728
    name: OAuth 2.0 Protected Resource Metadata
    conforms: true
    evidence: >-
      GET https://app.reachdesk.com/.well-known/oauth-protected-resource returns 200
      with resource, authorization_servers[], scopes_supported and
      bearer_methods_supported. It is the document named in the WWW-Authenticate
      challenge from POST /mcp, which is exactly how RFC 9728 is meant to be used.
  - id: rfc7591
    name: OAuth 2.0 Dynamic Client Registration
    conforms: true
    evidence: >-
      registration_endpoint https://app.reachdesk.com/oauth/register is advertised,
