openapi: 3.2.0
info:
  title: Reachdesk Organization API
  version: '1.0'
servers:
- url: https://app.reachdesk.com/api/v2
security:
- sec0: []
tags:
- name: Organization
paths:
  /organization:
    get:
      summary: Get Organization
      description: Retrieve the basic information about the Organization associated to the given API Token.
      operationId: get-organization
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"570\",\n  \"name\": \"Acne Inc.\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: '570'
                  name:
                    type: string
                    example: Acne Inc.
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Organization
components:
  securitySchemes:
    sec0:
      type: apiKey
      name: Authorization
      in: header
      x-bearer-format: bearer
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
