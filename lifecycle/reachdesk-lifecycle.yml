gaps:
  - No status page.
  - No deprecation or sunset policy, and no Deprecation/Sunset response headers.
  - No published SLA or uptime commitment.
  - >-
    API changes are announced in a general product release-notes stream aimed at
    platform users, not in a developer-facing changelog on the API reference site.
