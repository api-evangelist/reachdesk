description: >-
  Lifecycle posture for the Reachdesk API. Reachdesk versions its API in the URI
  path (v2) and publishes a monthly, dated product release-notes series that
  regularly names API changes. It publishes no deprecation policy, no sunset
  policy, no SLA and no status page — status.reachdesk.com does not resolve.

