method: probed
source: live GET probes of every apis.yml baseURL host, the OpenAPI servers[] host, and the docs host
description: >-
  Well-known URI probe for Reachdesk. Two real documents are served on the API
  host (app.reachdesk.com): RFC 8414 OAuth 2.0 Authorization Server Metadata and
  RFC 9728 OAuth 2.0 Protected Resource Metadata. Both exist to support the
  Reachdesk remote MCP server at https://app.reachdesk.com/mcp — the protected
  resource metadata is the exact document named in the WWW-Authenticate challenge
  that endpoint returns. No security.txt, no OpenID Connect discovery document,
  no api-catalog, and no A2A agent card are served on any Reachdesk host.
hosts:
  - host: app.reachdesk.com
    role: API host (OpenAPI servers[] host, MCP endpoint host)
    paths:
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        document: true
        file: well-known/reachdesk-oauth-authorization-server.json
        note: >-
          RFC 8414 metadata. issuer https://app.reachdesk.com, PKCE S256 only,
          dynamic client registration endpoint present, scopes_supported are the
          two MCP tool scopes.
      - path: /.well-known/oauth-protected-resource
        status: 200
        content_type: application/json
        document: true
        file: well-known/reachdesk-oauth-protected-resource.json
        note: >-
          RFC 9728 metadata. Referenced by resource_metadata= in the
          WWW-Authenticate: Bearer realm="MCP" challenge on POST /mcp.
      - path: /.well-known/openid-configuration
        status: 200
        content_type: text/html
        document: false
        note: >-
          NOT a document. Returns the Reachdesk application HTML shell, not an
          OIDC discovery document. Treated as a miss.
      - path: /.well-known/api-catalog
        status: 200
